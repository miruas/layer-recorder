# Suggested Layer shortcuts. Add this file to your own Hyprland configuration.
# The layer launcher must be on the graphical session's PATH.
bind = SUPER ALT, Z, exec, layer ui
bind = SUPER ALT, F7, exec, layer save-1
bind = SUPER ALT, F8, exec, layer save-5
bind = SUPER ALT, F9, exec, layer record
bind = SUPER ALT, F10, exec, layer replay
