[package]
name = "layer-recorderd"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "GSR process supervision, independent-track RAM replay and Layer IPC"
repository = "https://github.com/miruas/layer-recorder"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
libc = "0.2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
signal-hook = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
